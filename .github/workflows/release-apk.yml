name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate, sign and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate SemVer and Gradle version
        id: version
        shell: bash
        run: |
          chmod +x ./gradlew
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

          gradle_version="$(./gradlew -q :app:printVersionName)"
          if [[ "$tag_version" != "$gradle_version" ]]; then
            echo "Tag version $tag_version does not match versionName $gradle_version"
            exit 1
          fi

          current_code="$(./gradlew -q :app:printVersionCode)"
          for previous_tag in $(git tag --list 'v*' | grep -v "^${GITHUB_REF_NAME}$" || true); do
            previous_code="$(git show "$previous_tag:app/build.gradle.kts" 2>/dev/null | sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' | head -n 1)"
            if [[ -n "$previous_code" && "$current_code" -le "$previous_code" ]]; then
              echo "versionCode $current_code is not greater than $previous_code from $previous_tag"
              exit 1
            fi
          done

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          if [[ "$tag_version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --console=plain --no-daemon

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VISO_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "VISO_KEYSTORE_BASE64 is required"
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/viso-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Build signed release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.VISO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VISO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VISO_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "All release signing secrets are required"
            exit 1
          fi
          ./gradlew assembleRelease --console=plain --no-daemon \
            -PvisoKeystoreFile="${{ steps.keystore.outputs.path }}" \
            -PvisoKeystorePassword="$KEYSTORE_PASSWORD" \
            -PvisoKeyAlias="$KEY_ALIAS" \
            -PvisoKeyPassword="$KEY_PASSWORD"

      - name: Prepare APK and SHA-256
        id: artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          apk_name="Viso-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk_name"
          sha256sum "$apk_name" > "${apk_name}.sha256"
          echo "apk=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Viso ${{ steps.version.outputs.version }}"
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            ${{ steps.artifact.outputs.apk }}
            ${{ steps.artifact.outputs.apk }}.sha256
