name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --console=plain --no-daemon

      - name: Prepare APK asset
        run: cp app/build/outputs/apk/debug/app-debug.apk "Viso-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Viso ${{ github.ref_name }}"
          body: |
            APK publico do Viso para instalacao manual no Android.

            Como instalar:
            1. Baixe o arquivo APK abaixo.
            2. Abra o arquivo no celular.
            3. Autorize "instalar apps desconhecidos" se o Android solicitar.
            4. Conclua a instalacao e abra o Viso.

            Observacao: esta build e assinada como APK debug para facilitar distribuicao direta pelo GitHub.
          files: "Viso-${{ github.ref_name }}.apk"
